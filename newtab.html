<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab · Drip</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      .stage { width: 100%; max-width: 620px; }
      .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
      .foot { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
    </style>
  </head>
  <body>
    <div class="wrap" style="min-height:100vh;display:grid;place-items:center;padding:32px;">
      <div class="panel" style="max-width:520px;text-align:center;">
        <span class="eyebrow">Drip</span>
        <h1 style="margin-top:12px;">Cards are shown in the sidebar.</h1>
        <p class="muted" style="margin-top:10px;">Open the Drip sidebar to review flashcards. This page does not surface cards directly.</p>
        <button id="manage" style="margin-top:20px;">Manage decks</button>
      </div>
    </div>
    <script>
      document.getElementById('manage').addEventListener('click', () => chrome.runtime.openOptionsPage());
    </script>
  </body>
</html>
